name: my_handnote
description: 我的手写笔记 —— 拍照识别手写内容，排版并导出可搜索 PDF。
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoSansSC-Regular.ttf

dependencies:
  flutter:
    sdk: flutter
  # 相机 / 相册多选
  image_picker: ^1.1.2
  # 图像预处理（OpenCV 4 的 Dart FFI 绑定，含透视矫正、CLAHE、自适应阈值）
  opencv_dart: ^1.3.5
  # PDF 生成与预览分享
  pdf: ^3.11.1
  printing: ^5.13.2
  # 本地数据库（笔记库 / 全文检索）
  sqflite: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0
  # 状态管理
  flutter_riverpod: ^2.5.1
  # 云端 OCR 兜底（可选）
  http: ^1.2.2
  # 语音备注（P1）
  record: ^5.1.2
  # 工具
  uuid: ^4.5.1
  share_plus: ^10.0.2

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
